<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リア充爆破ゲーム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js 音声合成ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Font Awesome アイコン -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 分離したCSSファイル -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative bg-slate-900 text-white">

    <header class="absolute top-0 left-0 right-0 z-10 flex justify-between items-center p-3 md:p-4 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
        <div class="flex items-center gap-3 pointer-events-auto">
            <h1 class="text-2xl md:text-3xl font-black text-pink-500 tracking-wider text-shadow-pop flex items-center gap-2">
                <i class="fa-solid font-black fa-burst text-yellow-400"></i> リア充爆破!ｧｧｧｧｧｧｧｧｧ
            </h1>
        </div>

        <!-- スコア・コンボ表示 -->
        <div class="flex items-center gap-4 md:gap-8 pointer-events-auto">
            <div class="bg-black/60 border-2 border-pink-500/50 backdrop-blur-md px-4 py-1.5 rounded-full flex items-center gap-2">
                <span class="text-xs text-pink-300 font-bold uppercase tracking-wider">SCORE</span>
                <span id="scoreText" class="text-2xl md:text-3xl font-black text-yellow-300">0</span>
        </div>

        <!-- 設定・ミュートボタン -->
        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="soundBtn" class="btn-arcade bg-slate-700 hover:bg-slate-600 text-yellow-300 p-2.5 rounded-xl font-bold border-b-4 border-slate-900" title="ミュート切替">
                <i class="fa-solid fa-volume-high text-lg"></i>
            </button>
            <button id="assetModalBtn" class="btn-arcade bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-sm font-bold border-b-4 border-indigo-900 flex items-center gap-1.5">
                <i class="fa-solid fa-gear"></i> <span class="hidden sm:inline">設定・画像</span>
            </button>
        </div>
    </header>

    <main class="relative w-full h-full flex items-center justify-center overflow-hidden">
        <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>
        <!-- GIFアニメーション爆発エフェクトを表示するオーバーレイコンテナ -->
        <div id="explosionContainer" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
    </main>

    <div id="assetModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border-2 border-pink-500/50 rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <!-- モーダルヘッダー -->
            <div class="p-4 bg-slate-900 flex justify-between items-center border-b border-slate-700">
                <h2 class="text-xl font-bold text-pink-400 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> 設定 & 画像カスタム
                </h2>
                <button id="closeModalBtn" class="text-slate-400 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- モーダルボディ -->
            <div class="p-6 overflow-y-auto flex-1 space-y-6 text-sm">
                <!-- JSON設定セクション -->
                <div class="bg-slate-900/80 p-4 rounded-xl border border-indigo-500/40 space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <h3 class="font-bold text-yellow-300 flex items-center gap-2 text-base">
                            <i class="fa-solid fa-file-code"></i> ゲーム設定 (setting.json)
                        </h3>
                        <label class="btn-arcade bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg cursor-pointer border-b-2 border-indigo-900 font-bold">
                            <i class="fa-solid fa-upload mr-1"></i> setting.json 読み込み
                            <input type="file" id="jsonFileInput" accept=".json" class="hidden">
                        </label>
                    </div>

                    <p class="text-xs text-slate-300">
                        `setting.json` から読み込んだパラメーターです。以下で調整してリアルタイムに変更できます。
                    </p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                        <!-- 音量 -->
                        <div class="bg-slate-800 p-3 rounded-lg">
                            <div class="flex justify-between mb-1">
                                <span class="font-bold text-slate-300">音量 (volume)</span>
                                <span id="volVal" class="text-yellow-400 font-mono font-bold">0.8</span>
                            </div>
                            <input type="range" id="volRange" min="0" max="1" step="0.05" value="0.8" class="w-full accent-pink-500 cursor-pointer">
                        </div>

                        <!-- キャラ最大数 -->
                        <div class="bg-slate-800 p-3 rounded-lg">
                            <div class="flex justify-between mb-1">
                                <span class="font-bold text-slate-300">同時最大数 (maxCharacters)</span>
                                <span id="maxCharVal" class="text-yellow-400 font-mono font-bold">20</span>
                            </div>
                            <input type="range" id="maxCharRange" min="1" max="50" step="1" value="20" class="w-full accent-pink-500 cursor-pointer">
                        </div>

                        <!-- キャラの大きさ -->
                        <div class="bg-slate-800 p-3 rounded-lg">
                            <div class="flex justify-between mb-1">
                                <span class="font-bold text-slate-300">キャラの大きさ (characterSize)</span>
                                <span id="charSizeVal" class="text-yellow-400 font-mono font-bold">100px</span>
                            </div>
                            <input type="range" id="charSizeRange" min="40" max="250" step="5" value="100" class="w-full accent-pink-500 cursor-pointer">
                        </div>

                        <!-- 爆発サイズ -->
                        <div class="bg-slate-800 p-3 rounded-lg">
                            <div class="flex justify-between mb-1">
                                <span class="font-bold text-slate-300">爆発サイズ (bombSize)</span>
                                <span id="bombSizeVal" class="text-yellow-400 font-mono font-bold">140px</span>
                            </div>
                            <input type="range" id="bombSizeRange" min="50" max="300" step="5" value="140" class="w-full accent-pink-500 cursor-pointer">
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <button id="downloadJsonBtn" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg text-slate-200 border border-slate-600 flex items-center gap-1 font-bold">
                            <i class="fa-solid fa-download"></i> 現在の設定を setting.json として保存
                        </button>
                    </div>
                </div>

                <!-- カスタム画像設定 -->
                <div class="space-y-4">
                    <h3 class="font-bold text-pink-400 border-b border-slate-700 pb-2 text-base flex items-center gap-2">
                        <i class="fa-solid fa-image"></i> カスタム画像設定
                    </h3>

                    <!-- 背景画像 -->
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700">
                        <label class="block font-bold text-yellow-400 mb-1 text-xs">背景画像 (bg.webp)</label>
                        <input type="file" id="bgInput" accept="image/*" class="block w-full text-xs text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-pink-600 file:text-white hover:file:bg-pink-500">
                    </div>

                    <!-- キャラクター画像 -->
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700">
                        <label class="block font-bold text-pink-400 mb-2 text-xs">キャラクター画像 (1.webp 〜 10.webp)</label>
                        <div id="characterInputsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                    </div>

                    <!-- 爆発画像 -->
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700">
                        <label class="block font-bold text-red-400 mb-1 text-xs">爆発エフェクト画像 (bomb.webp)</label>
                        <input type="file" id="bombInput" accept="image/*" class="block w-full text-xs text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-500">
                    </div>
                </div>
            </div>

            <!-- モーダルプロフッター -->
            <div class="p-4 bg-slate-900 border-t border-slate-700 flex justify-end">
                <button id="saveModalBtn" class="btn-arcade bg-pink-600 hover:bg-pink-500 text-white px-6 py-2 rounded-xl font-bold border-b-4 border-pink-800">
                    完了
                </button>
            </div>
        </div>
    </div>

    <!-- 分離したJavaScriptファイル -->
    <script src="script.js"></script>
</body>
</html>
